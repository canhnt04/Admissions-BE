version: '3.8'

services:
  crm-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crm-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Passw0rd!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  crm-rabbitmq:
    image: rabbitmq:3-management
    container_name: crm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-api:
    build:
      context: .
      dockerfile: src/Auth.API/Dockerfile
    container_name: auth-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AppSettings__AccessToken=Your_Secret_Key_For_JWT_Validation_Needs_To_Be_At_Least_64_Characters_Long!
      - ConnectionStrings__CrmDatabase=Server=crm-sqlserver;Database=CrmAdmissions;User Id=sa;Password=Your_Strong_Passw0rd!;TrustServerCertificate=True;
      - RabbitMQ__Host=crm-rabbitmq
    depends_on:
      - crm-sqlserver
      - crm-rabbitmq

  formal-api:
    build:
      context: .
      dockerfile: src/Formal.API/Dockerfile
    container_name: formal-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CrmDatabase=Server=crm-sqlserver;Database=CrmAdmissions;User Id=sa;Password=Your_Strong_Passw0rd!;TrustServerCertificate=True;
      - RabbitMQ__Host=crm-rabbitmq
    depends_on:
      - crm-sqlserver
      - crm-rabbitmq

  shortterm-api:
    build:
      context: .
      dockerfile: src/ShortTerm.API/Dockerfile
    container_name: shortterm-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CrmDatabase=Server=crm-sqlserver;Database=CrmAdmissions;User Id=sa;Password=Your_Strong_Passw0rd!;TrustServerCertificate=True;
      - RabbitMQ__Host=crm-rabbitmq
    depends_on:
      - crm-sqlserver
      - crm-rabbitmq

  driving-api:
    build:
      context: .
      dockerfile: src/Driving.API/Dockerfile
    container_name: driving-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CrmDatabase=Server=crm-sqlserver;Database=CrmAdmissions;User Id=sa;Password=Your_Strong_Passw0rd!;TrustServerCertificate=True;
      - RabbitMQ__Host=crm-rabbitmq
    depends_on:
      - crm-sqlserver
      - crm-rabbitmq

  api-gateway:
    build:
      context: .
      dockerfile: src/Crm.ApiGateway/Dockerfile
    container_name: api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AppSettings__AccessToken=Your_Secret_Key_For_JWT_Validation_Needs_To_Be_At_Least_64_Characters_Long!
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-api__Address=http://auth-api:8080/
      - ReverseProxy__Clusters__formal-cluster__Destinations__formal-api__Address=http://formal-api:8080/
      - ReverseProxy__Clusters__shortterm-cluster__Destinations__shortterm-api__Address=http://shortterm-api:8080/
      - ReverseProxy__Clusters__driving-cluster__Destinations__driving-api__Address=http://driving-api:8080/
    ports:
      - "5000:8080"
    depends_on:
      - auth-api
      - formal-api
      - shortterm-api
      - driving-api

volumes:
  sqldata:
